name: Update playlist

on:
  schedule:
    - cron: "0 20 * * *"   # 04:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build playlist
        run: python build_playlist.py playlist.m3u
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain playlist.m3u)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add playlist.m3u
            git commit -m "chore: update playlist $(date -u +%F)"
            git push
          fi
